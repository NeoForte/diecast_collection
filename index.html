<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AJ's Garage" />
  <link rel="manifest" href="manifest.webmanifest?v=15" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=15" />
  <title>AJ's Garage</title>
</head>
<body>
  <div id="app">
    <section id="auth-view" class="view center-view">
      <div class="auth-card">
        <div class="app-mark">AJ</div>
        <h1>AJ's Garage</h1>
        <p class="muted">Private diecast collection</p>
        <form id="auth-form">
          <label>Email<input id="email" type="email" autocomplete="email" /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
          <button id="login-btn" type="submit">Sign In</button>
        </form>
        <button id="signup-btn" class="secondary" type="button">Create Account</button>
        <p id="auth-message" class="message"></p>
      </div>
    </section>

    <section id="main-view" class="view hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">PRIVATE COLLECTION</div>
          <h1>AJ's Garage</h1>
        </div>
        <button id="logout-btn" class="text-button">Sign out</button>
      </header>

      <main>
        <nav id="main-nav" class="main-nav" aria-label="App pages">
          <button id="collection-nav" class="nav-button active" type="button">Collection</button>
          <button id="stats-nav" class="nav-button" type="button">Stats</button>
          <button id="quick-add-button" class="nav-button" type="button">⚡ Quick Add</button>
        </nav>

        <section id="collection-screen" class="screen active">
          <div class="toolbar">
            <input id="search-input" type="search" placeholder="Search brand, model, year…" />
            <button id="add-button" class="add-button" aria-label="Add car">＋</button>
          </div>
          <div class="summary-row">
            <div class="collection-summary-left">
              <span id="car-count">0 cars</span>
              <label class="sort-control" for="sort-select">
                <span>Sort</span>
                <select id="sort-select" aria-label="Sort collection">
                  <option value="newest">Newest Added</option>
                  <option value="oldest">Oldest Added</option>
                  <option value="brand-az">Brand A–Z</option>
                  <option value="brand-za">Brand Z–A</option>
                  <option value="model-az">Model A–Z</option>
                  <option value="model-za">Model Z–A</option>
                  <option value="qty-high">Quantity High–Low</option>
                  <option value="qty-low">Quantity Low–High</option>
                  <option value="special-first">Special First</option>
                </select>
              </label>
            </div>
            <div class="summary-actions">
              <button id="backup-button" class="text-button" type="button">Export Backup</button>
              <button id="refresh-button" class="text-button" type="button">Refresh</button>
            </div>
          </div>
          <div id="cars-grid" class="cars-grid"></div>
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">🚗</div>
            <h2>No cars yet</h2>
            <p>Add your first diecast car. Every field is optional.</p>
            <button id="empty-add-button">Add Car</button>
          </div>
        </section>

        <section id="stats-screen" class="screen">
          <div class="page-heading">
            <div>
              <div class="eyebrow">DIECAST BRANDS</div>
              <h2>Brand Stats</h2>
            </div>
          </div>
          <div class="stats-overview">
            <div class="stat-summary-card"><span>Unique Cars</span><strong id="stats-total">0</strong></div>
            <div class="stat-summary-card"><span>Grand Total</span><strong id="stats-grand-total">0</strong></div>
          </div>
          <div id="brand-stats" class="brand-stats"></div>
        </section>

        <section id="editor-screen" class="screen">
          <div class="editor-header">
            <button id="cancel-button" class="text-button">Cancel</button>
            <h2 id="editor-title">Add Car</h2>
            <button id="save-button" class="text-button strong" type="button">Save</button>
          </div>

          <div class="photo-picker">
            <img id="photo-preview" class="hidden" alt="Car preview" />
            <div id="photo-placeholder">📷<span>Take Photo or Choose from Library</span></div>
            <input id="photo-input" type="file" accept="image/*" />
          </div>

          <form id="car-form" class="car-form">
            <label>Diecast Brand
              <select id="diecast-brand">
                <option value=""></option>
                <option value="Hot Wheels">Hot Wheels</option>
                <option value="Matchbox">Matchbox</option>
                <option value="M2">M2</option>
                <option value="Cartuned">Cartuned</option>
                <option value="Maisto">Maisto</option>
                <option value="Mini GT">Mini GT</option>
                <option value="Majorette">Majorette</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label id="custom-brand-label" class="hidden">Other Brand
              <input id="custom-brand" type="text" placeholder="Type brand name" />
            </label>
            <label>Model<input id="model" type="text" placeholder="911 GT3, Mustang, Camaro…" autocomplete="off" /></label>
            <div id="duplicate-warning" class="duplicate-warning hidden" role="status" aria-live="polite">
              <div id="duplicate-warning-text"></div>
              <div id="duplicate-warning-actions" class="duplicate-warning-actions">
                <button id="duplicate-increase-btn" type="button">Increase Qty</button>
                <button id="duplicate-anyway-btn" type="button">Add Anyway</button>
              </div>
            </div>
            <div class="quick-core-row">
              <div class="quantity-field">
                <label for="quantity">Quantity</label>
                <div class="quantity-control">
                  <button id="quantity-minus" class="quantity-step" type="button" aria-label="Decrease quantity">−</button>
                  <input id="quantity" type="number" min="1" step="1" inputmode="numeric" placeholder="Optional" aria-label="Quantity" />
                  <button id="quantity-plus" class="quantity-step" type="button" aria-label="Increase quantity">+</button>
                </div>
              </div>
              <label>Special / Rarity
                <select id="special-status">
                  <option value=""></option>
                  <option value="TH">Treasure Hunt (TH)</option>
                  <option value="STH">Super Treasure Hunt (STH)</option>
                  <option value="Chase">Chase</option>
                  <option value="Rare">Rare</option>
                  <option value="Limited">Limited / Special Edition</option>
                  <option value="Other">Other Special</option>
                </select>
              </label>
            </div>
            <button id="more-details-toggle" class="more-details-toggle hidden" type="button">More Details ▾</button>
            <div id="more-details-section">
              <div class="two-col">
                <label>Model Year
                  <select id="model-year">
                    <option value=""></option>
                  </select>
                </label>
                <label>Scale<input id="scale" type="text" placeholder="1:64" /></label>
              </div>
              <label id="custom-year-label" class="hidden">Other Model Year
                <input id="custom-year" type="text" inputmode="numeric" placeholder="Type year" />
              </label>
              <label>Series / Collection<input id="series" type="text" placeholder="Optional" /></label>
              <div class="two-col number-fields">
                <label>General Number
                  <input id="general-number" type="text" inputmode="text" placeholder="e.g. 123/250" autocomplete="off" />
                </label>
                <label>Series / Collection Number
                  <input id="series-collection-number" type="text" inputmode="text" placeholder="e.g. 3/10" autocomplete="off" />
                </label>
              </div>
              <label>Notes<textarea id="notes" rows="4" placeholder="Optional notes"></textarea></label>
            </div>
          </form>

          <button id="delete-button" class="danger hidden" type="button">Delete Car</button>
          <p id="editor-message" class="message"></p>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="app.js?v=15"></script>
</body>
</html>
