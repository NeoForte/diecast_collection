<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AJ's Garage" />
  <link rel="manifest" href="manifest.webmanifest?v=5" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <title>AJ's Garage</title>
</head>
<body>
  <div id="app">
    <section id="auth-view" class="view center-view">
      <div class="auth-card">
        <div class="app-mark">AJ</div>
        <h1>AJ's Garage</h1>
        <p class="muted">Private diecast collection</p>
        <form id="auth-form">
          <label>Email<input id="email" type="email" autocomplete="email" /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
          <button id="login-btn" type="submit">Sign In</button>
        </form>
        <button id="signup-btn" class="secondary" type="button">Create Account</button>
        <p id="auth-message" class="message"></p>
      </div>
    </section>

    <section id="main-view" class="view hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">PRIVATE COLLECTION</div>
          <h1>AJ's Garage</h1>
        </div>
        <button id="logout-btn" class="text-button">Sign out</button>
      </header>

      <main>
        <nav id="main-nav" class="main-nav" aria-label="App pages">
          <button id="collection-nav" class="nav-button active" type="button">Collection</button>
          <button id="stats-nav" class="nav-button" type="button">Stats</button>
        </nav>

        <section id="collection-screen" class="screen active">
          <div class="toolbar">
            <input id="search-input" type="search" placeholder="Search brand, model, year…" />
            <button id="add-button" class="add-button" aria-label="Add car">＋</button>
          </div>
          <div class="summary-row">
            <span id="car-count">0 cars</span>
            <div class="summary-actions">
              <button id="backup-button" class="text-button" type="button">Export Backup</button>
              <button id="refresh-button" class="text-button" type="button">Refresh</button>
            </div>
          </div>
          <div id="cars-grid" class="cars-grid"></div>
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">🚗</div>
            <h2>No cars yet</h2>
            <p>Add your first diecast car. Every field is optional.</p>
            <button id="empty-add-button">Add Car</button>
          </div>
        </section>

        <section id="stats-screen" class="screen">
          <div class="page-heading">
            <div>
              <div class="eyebrow">DIECAST BRANDS</div>
              <h2>Brand Stats</h2>
            </div>
            <span id="stats-total" class="stats-total">0 cars</span>
          </div>
          <div id="brand-stats" class="brand-stats"></div>
        </section>

        <section id="editor-screen" class="screen">
          <div class="editor-header">
            <button id="cancel-button" class="text-button">Cancel</button>
            <h2 id="editor-title">Add Car</h2>
            <button id="save-button" class="text-button strong" type="button">Save</button>
          </div>

          <div class="photo-picker">
            <img id="photo-preview" class="hidden" alt="Car preview" />
            <div id="photo-placeholder">📷<span>Take Photo or Choose from Library</span></div>
            <input id="photo-input" type="file" accept="image/*" />
          </div>

          <form id="car-form" class="car-form">
            <label>Diecast Brand
              <input id="diecast-brand" type="text" list="brand-options" placeholder="Choose or type a brand" />
              <datalist id="brand-options">
                <option value="Hot Wheels"></option>
                <option value="Matchbox"></option>
                <option value="M2"></option>
                <option value="Cartuned"></option>
                <option value="Maisto"></option>
                <option value="Mini GT"></option>
                <option value="Majorette"></option>
                <option value="Other"></option>
              </datalist>
            </label>
            <label>Model<input id="model" type="text" placeholder="911 GT3, Mustang, Camaro…" /></label>
            <div class="two-col">
              <label>Model Year
                <input id="model-year" type="text" list="year-options" inputmode="numeric" placeholder="Choose or type a year" />
                <datalist id="year-options"></datalist>
              </label>
              <label>Scale<input id="scale" type="text" placeholder="1:64" /></label>
            </div>
            <label>Series / Collection<input id="series" type="text" placeholder="Optional" /></label>
            <div class="two-col">
              <label>Quantity<input id="quantity" type="number" min="0" inputmode="numeric" placeholder="Optional" /></label>
              <label>NIB / Loose
                <select id="package-status">
                  <option value=""></option>
                  <option value="NIB">NIB</option>
                  <option value="Loose">Loose</option>
                </select>
              </label>
            </div>
            <label>Notes<textarea id="notes" rows="4" placeholder="Optional notes"></textarea></label>
          </form>

          <button id="delete-button" class="danger hidden" type="button">Delete Car</button>
          <p id="editor-message" class="message"></p>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="app.js?v=5"></script>
</body>
</html>
