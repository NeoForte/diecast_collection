<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="Pocket 64 Community Garage collectors admiring a performance car">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02060a"/>
      <stop offset="0.48" stop-color="#07131d"/>
      <stop offset="1" stop-color="#010305"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c141c"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef4"/>
      <stop offset="0.28" stop-color="#9aa9b7"/>
      <stop offset="0.62" stop-color="#46535e"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ed8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#07111a" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#6cc7ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#238ed9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#238ed9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51b9ff"/>
      <stop offset="1" stop-color="#1280d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1400" height="520" fill="url(#bg)"/>
  <rect y="334" width="1400" height="186" fill="url(#floor)"/>

  <g opacity="0.72">
    <path d="M0 84h1400M0 171h1400M0 258h1400" stroke="#132431" stroke-width="2"/>
    <path d="M130 0v334M360 0v334M590 0v334M820 0v334M1050 0v334M1280 0v334" stroke="#0f202d" stroke-width="2"/>
  </g>

  <g opacity="0.9">
    <rect x="68" y="52" width="290" height="42" rx="7" fill="#06101a" stroke="#1c6ea5"/>
    <text x="88" y="80" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#81cfff">POCKET 64 COMMUNITY</text>
    <rect x="1030" y="52" width="302" height="42" rx="7" fill="#06101a" stroke="#1c6ea5"/>
    <text x="1053" y="80" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#81cfff">COLLECT • SHARE • DISCOVER</text>
  </g>

  <circle cx="250" cy="190" r="170" fill="url(#lamp)" filter="url(#soft)"/>
  <circle cx="1130" cy="178" r="190" fill="url(#lamp)" filter="url(#soft)"/>
  <path d="M480 32h440" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <g opacity="0.45">
    <rect x="110" y="132" width="145" height="118" rx="7" fill="#07111a" stroke="#18334a"/>
    <rect x="280" y="136" width="110" height="114" rx="7" fill="#07111a" stroke="#18334a"/>
    <rect x="1018" y="132" width="150" height="118" rx="7" fill="#07111a" stroke="#18334a"/>
    <rect x="1187" y="136" width="100" height="114" rx="7" fill="#07111a" stroke="#18334a"/>
    <path d="M120 150h125M120 174h125M120 198h125M292 156h86M292 184h86M1028 152h130M1028 180h130M1028 208h130M1198 158h77M1198 190h77" stroke="#1a2d3c" stroke-width="5"/>
  </g>

  <!-- people -->
  <g fill="#0a0f14" stroke="#27455d" stroke-width="2.2">
    <circle cx="318" cy="256" r="25"/>
    <path d="M282 332c6-44 18-69 36-69 20 0 33 25 39 69v93h-75z"/>
    <circle cx="430" cy="234" r="23"/>
    <path d="M397 322c5-47 17-72 33-72 18 0 30 25 36 72v86h-69z"/>
    <circle cx="994" cy="245" r="23"/>
    <path d="M960 329c6-46 17-70 34-70 19 0 31 24 36 70v88h-70z"/>
    <circle cx="1095" cy="270" r="24"/>
    <path d="M1058 344c7-42 19-65 37-65 20 0 32 23 38 65v82h-75z"/>
  </g>
  <g fill="#1d79b8" opacity="0.62">
    <rect x="301" y="294" width="34" height="10" rx="5"/>
    <rect x="413" y="283" width="34" height="10" rx="5"/>
    <rect x="977" y="290" width="34" height="10" rx="5"/>
    <rect x="1078" y="310" width="34" height="10" rx="5"/>
  </g>

  <!-- car shadow -->
  <ellipse cx="700" cy="423" rx="300" ry="43" fill="#000" opacity="0.72"/>

  <!-- performance car -->
  <g>
    <path d="M446 381c18-67 78-119 165-132 41-7 82-11 120-10 79 2 154 29 207 87l58 23 17 53-23 26H455l-31-25z" fill="url(#car)" stroke="#b6c7d6" stroke-opacity="0.38" stroke-width="3"/>
    <path d="M566 283c36-27 82-39 133-41 50-2 98 9 137 35l49 54H517z" fill="#192630" stroke="#8298aa" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M594 281c27-19 61-28 100-29l-4 76H531z" fill="url(#glass)"/>
    <path d="M707 252c43 0 79 9 108 29l44 47H713z" fill="url(#glass)"/>
    <path d="M464 363h121l19 43H444z" fill="#0e151b" opacity="0.75"/>
    <path d="M894 348h91l22 37-104-5z" fill="#e8f6ff" opacity="0.78" filter="url(#glow)"/>
    <path d="M467 349h67l-15 25h-64z" fill="#84cfff" opacity="0.4"/>
    <path d="M992 338h92l10 17-102 6z" fill="#1d2d39" stroke="#8395a3" stroke-opacity="0.35"/>
    <path d="M1015 337l13-46 72 6 15 22-23 11z" fill="#101820" stroke="#7b8c99" stroke-opacity="0.4"/>
    <circle cx="560" cy="405" r="57" fill="#050708" stroke="#2e3c48" stroke-width="8"/>
    <circle cx="560" cy="405" r="30" fill="#8998a5" stroke="#d7e0e8" stroke-opacity="0.35" stroke-width="5"/>
    <circle cx="913" cy="405" r="57" fill="#050708" stroke="#2e3c48" stroke-width="8"/>
    <circle cx="913" cy="405" r="30" fill="#8998a5" stroke="#d7e0e8" stroke-opacity="0.35" stroke-width="5"/>
    <path d="M620 386h228" stroke="#6ec8ff" stroke-width="4" opacity="0.55"/>
    <path d="M492 420c91 23 328 24 449-4" stroke="#60baff" stroke-width="3" opacity="0.28"/>
  </g>

  <g>
    <rect x="440" y="100" width="520" height="92" rx="18" fill="#02070c" fill-opacity="0.72" stroke="#1e547b"/>
    <text x="700" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="9" fill="#66bdf8">POCKET 64</text>
    <text x="700" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="900" letter-spacing="5" fill="#f2f7fb">COMMUNITY GARAGE</text>
  </g>

  <rect x="0" y="0" width="1400" height="520" fill="none" stroke="#0e4f7d" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M0 470c260-46 431-33 699 0 253 31 471 31 701-2v52H0z" fill="#000" opacity="0.36"/>
</svg>