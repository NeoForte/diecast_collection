name: Package Pocket 64 v6.2.2

on:
  push:
    paths:
      - '.github/workflows/package-v622.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full project ZIP
        run: |
          zip -r Pocket-64-v6.2.2-FULL-PROJECT.zip . -x '.git/*' 'Pocket-64-v6.2.2-FULL-PROJECT.zip'
          unzip -t Pocket-64-v6.2.2-FULL-PROJECT.zip
      - name: Confirm Community Garage loader is included
        run: |
          grep -q "loadModernCommunity" p64-v615-community-entry.js
          grep -q '"version": "6.2.2"' version.json
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v6.2.2-FULL-PROJECT
          path: Pocket-64-v6.2.2-FULL-PROJECT.zip
          if-no-files-found: error
          retention-days: 30
