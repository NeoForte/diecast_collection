name: Package Pocket 64 v6.1.6

on:
  push:
    branches:
      - release-v6.1.6-help-dedupe
      - main
    paths:
      - 'version.json'
      - 'p64-v525-patch.js'
      - 'RELEASE-NOTES-v6.1.6.txt'
      - '.github/workflows/package-v616.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v6.1.6
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "6.1.6"' version.json
          grep -q "const VERSION='6.1.6'" p64-v525-patch.js
          grep -q 'removeLegacyFaqEntry' p64-v525-patch.js
      - name: Build full rollback ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r Pocket-64-v6.1.6-FULL-PROJECT.zip . \
            -x '.git/*' \
            -x 'Pocket-64-v6.1.6-FULL-PROJECT.zip'
          unzip -t Pocket-64-v6.1.6-FULL-PROJECT.zip
          sha256sum Pocket-64-v6.1.6-FULL-PROJECT.zip > Pocket-64-v6.1.6-FULL-PROJECT.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v6.1.6-FULL-PROJECT
          path: |
            Pocket-64-v6.1.6-FULL-PROJECT.zip
            Pocket-64-v6.1.6-FULL-PROJECT.sha256
          if-no-files-found: error
