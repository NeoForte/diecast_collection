name: Package Pocket 64 v6.2.5

on:
  push:
    paths:
      - '.github/workflows/package-v625.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release markers
        run: |
          grep -q '"version": "6.2.5"' version.json
          grep -q "pocket64-shell-v21" sw.js
          grep -q "community-garage-hero.png" p64-v623-community-polish.js
      - name: Build full project ZIP
        run: |
          zip -r Pocket-64-v6.2.5-FULL-PROJECT.zip . -x '.git/*' 'Pocket-64-v6.2.5-FULL-PROJECT.zip'
          unzip -t Pocket-64-v6.2.5-FULL-PROJECT.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v6.2.5-FULL-PROJECT
          path: Pocket-64-v6.2.5-FULL-PROJECT.zip
          if-no-files-found: error
          retention-days: 30
