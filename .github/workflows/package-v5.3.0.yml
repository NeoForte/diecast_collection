name: Package Pocket 64 v5.3.0

on:
  push:
    branches:
      - pocket64-v5.3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Create complete project ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/Pocket-64-v5.3.0-FULL-PROJECT.zip" . \
            -x ".git/*" \
               "dist/*"

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v5.3.0-FULL-PROJECT
          path: dist/Pocket-64-v5.3.0-FULL-PROJECT.zip
          if-no-files-found: error
          retention-days: 30
