name: Package Pocket 64 v6.1.9

on:
  push:
    branches:
      - release-v6.1.9-source-consolidation

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v6.1.9 source consolidation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "6.1.9"' version.json
          grep -q "const VERSION='6.1.9'" p64-v525-patch.js
          test -f ARCHITECTURE.md
          test -f supabase/functions/pocket64-support/index.ts
          test -f supabase/migrations/20260902_support_requests.sql
          test ! -e manifest.webmanifest
          test ! -e icon-192.png
          test ! -e README.txt
          test ! -e DATABASE-UPDATE-LATER.sql
          test ! -e SNAPSHOT.txt
          test ! -e pocket64-banner.png
          test ! -e pocket64-banner-v242.png
          test ! -e pocket64-empty-slot.jpg
          test ! -e pocket64-empty-slot.png
          test ! -e pocket64-header-v25.png
          test ! -e index.ts
          test ! -e 20260902_pocket64_v419_support_requests.sql
          test ! -e .github/workflows/package-v618.yml
          ! find . -maxdepth 1 -type f -name 'RELEASE-NOTES-v*.txt' ! -name 'RELEASE-NOTES-v6.1.9.txt' | grep -q .
      - name: Build full rollback ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r Pocket-64-v6.1.9-FULL-PROJECT.zip . \
            -x '.git/*' \
            -x 'Pocket-64-v6.1.9-FULL-PROJECT.zip'
          unzip -t Pocket-64-v6.1.9-FULL-PROJECT.zip
          sha256sum Pocket-64-v6.1.9-FULL-PROJECT.zip > Pocket-64-v6.1.9-FULL-PROJECT.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v6.1.9-FULL-PROJECT
          path: |
            Pocket-64-v6.1.9-FULL-PROJECT.zip
            Pocket-64-v6.1.9-FULL-PROJECT.sha256
          if-no-files-found: error
