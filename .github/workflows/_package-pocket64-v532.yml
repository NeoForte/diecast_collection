name: Build Pocket 64 v5.3.2 full backup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_package-pocket64-v532.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pocket 64 v5.3.2
        uses: actions/checkout@v4

      - name: Create complete recovery ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/Pocket-64-v5.3.2-FULL-PROJECT.zip" . \
            -x ".git/*" \
               "dist/*"

      - name: Upload complete recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-64-v5.3.2-FULL-PROJECT
          path: dist/Pocket-64-v5.3.2-FULL-PROJECT.zip
          if-no-files-found: error
          retention-days: 30
