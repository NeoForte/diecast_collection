name: Build v6.2.6 Community hero

on:
  push:
    branches:
      - release-v6.2.6
    paths:
      - '.build-v626/**'
      - '.github/workflows/build-v626-hero.yml'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v6.2.6
      - name: Reconstruct verified WebP hero
        shell: bash
        run: |
          set -euo pipefail
          for f in w25.b64.00a w25.b64.00b w25.b64.01 w25.b64.02 w25.b64.03 w25.b64.04; do
            test -f ".build-v626/$f" || { echo "Waiting for $f"; exit 0; }
          done
          cat \
            .build-v626/w25.b64.00a \
            .build-v626/w25.b64.00b \
            .build-v626/w25.b64.01 \
            .build-v626/w25.b64.02 \
            .build-v626/w25.b64.03 \
            .build-v626/w25.b64.04 \
            | base64 -d > community-garage-hero-v626.webp
          test "$(stat -c%s community-garage-hero-v626.webp)" -eq 14006
          echo "dcfb699e08d039045ee820bb13bcf0b3fe2a623296bcce00f5ffc8b6826e0f2a  community-garage-hero-v626.webp" | sha256sum -c -
          rm -rf .build-v626
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-garage-hero-v626.webp .build-v626
          git commit -m "Install verified Community Garage WebP for v6.2.6"
          git push origin HEAD:release-v6.2.6
