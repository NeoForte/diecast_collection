<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pocket 64" />
  <title>Pocket 64</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#dbeeff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center}
    .boot{font-size:12px;font-weight:800;letter-spacing:.12em;opacity:.72}
  </style>
</head>
<body>
  <div class="boot">POCKET 64</div>
  <script>
    (async () => {
      const destination = './?pwa=1'
      if (!('serviceWorker' in navigator)) {
        location.replace(destination)
        return
      }

      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' })
        try { await registration.update() } catch {}
        await navigator.serviceWorker.ready

        if (!navigator.serviceWorker.controller) {
          await Promise.race([
            new Promise((resolve) => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once:true })),
            new Promise((resolve) => setTimeout(resolve, 1800)),
          ])
        }
      } catch (error) {
        console.warn('Pocket 64 PWA boot could not confirm service worker control', error)
      }

      location.replace(destination)
    })()
  </script>
</body>
</html>
